aid: mozi
name: Mozi
description: Mozi is a private social network mobile app founded by Twitter and Medium co-founder Ev Williams
  and Molly DeWolf Swenson, and backed by Obvious Ventures. Rather than public profiles or follower counts,
  Mozi privately matches your phone contacts so you learn when friends are in the same city, attending the
  same events, or checking in nearby — designed to spark in-person "social serendipity" and get people off
  their screens. Launched in December 2024 and available in 135+ countries, Mozi is a consumer iOS/Android
  application with no public developer program, API, or SDK surface at this time.
